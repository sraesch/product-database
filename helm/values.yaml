# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/sraesch
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.1.2"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# The configuration of the SQL database where the product data is stored
db:
  # The storage size for the product SQL database
  storage: 100Gi

  # Specify the storage class to use
  storageClass: local-path

  # The access mode of the storage. Currently, it is not possible to have multiple replicas of the database.
  # Therefore, ReadWriteOnce is sufficient.
  accessMode: ReadWriteOnce

  # The user for the database
  username: product_db_user

  # The name of the database
  dbname: product_db

# The REST service for the product data
service:
  # The log level of the REST service. Can be one of: Trace, Debug, Info, Warn, Error
  logLevel: Info
  
  # Service type configuration
  # type: ClusterIP  # Can be ClusterIP, NodePort, or LoadBalancer
  type: NodePort
  
  # NodePort configuration (only used when service.type is NodePort)
  nodePort:
    # Enable NodePort service
    enabled: true
    # The port on each node where the service will be exposed (30000-32767)
    port: 30080

# Ingress configuration for exposing the REST service
ingress:
  # Enable ingress
  enabled: false
  
  # Ingress class name (optional, depends on your cluster setup)
  # className: nginx
  
  # Annotations for the ingress (optional)
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/server-port: "8080"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  
  # Hosts configuration
  hosts:
    - host: localhost
      path: /api
      pathType: Prefix
  
  # TLS configuration (optional)
  tls: []
    # - secretName: product-db-tls
    #   hosts:
    #     - your-domain.com

# The credentials for the database
credentials:
  # Depending on your environment, you might want to use a secret store like HashiCorp Vault or AWS Secrets Manager
  db_password: postgres